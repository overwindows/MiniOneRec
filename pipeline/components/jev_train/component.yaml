$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: jev_train
display_name: JEV-4B Full-Depth Decision Training
version: "4"
type: command
description: Train JEV on MIND with legacy full-vocabulary CE or candidate-only A/B loss

inputs:
  msndni:
    type: uri_folder
    mode: rw_mount
    description: 数据存储挂载路径
  model_path:
    type: string
    default: "shares/users/wuc/models/APUS-OpenJev-v1-4B"
    description: JEV-4B 模型路径 (相对于挂载路径)
  data_root:
    type: string
    default: "shares/users/wuc/data/MIND_large"
    description: 数据集根目录 (相对于挂载路径)
  batch_size:
    type: integer
    default: 128
  micro_batch_size:
    type: integer
    default: 2
  num_epochs:
    type: integer
    default: 3
  neg_ratio:
    type: number
    default: 1.0
  hard_neg_ratio:
    type: number
    default: 0.5
  max_history:
    type: integer
    default: 30
  cutoff_len:
    type: integer
    default: 4096
  sample:
    type: integer
    default: -1
    description: 抽样子集上限 (>=0 强制截断训练样本数；-1 表示全量)
  use_chat_template:
    type: integer
    default: 0
  use_abstract:
    type: integer
    default: 1
  kl_beta:
    type: string
    default: "0.1"
    description: Historical compatibility flag; no KL term is implemented
  enable_kl:
    type: string
    default: "1"
    description: Historical compatibility flag; decision loss requires 0
  loss_type:
    type: string
    default: "full_vocab"
    enum: ["full_vocab", "decision"]
  prompt_contract:
    type: string
    default: "legacy"
    enum: ["legacy", "native_click"]
  source_revision:
    type: string
    default: "origin/dev"
    description: Git revision checked out by the worker; submitter supplies an immutable commit SHA
  output_root:
    type: string
    default: "shares/users/wuc/output_dir"
    description: 输出目录根路径 (相对于挂载路径)
  code_revision:
    type: string
    default: "0"
    description: >-
      Cache-buster. The actual training code is git-cloned at runtime inside the
      node, which AML's component-level reuse can't see. Bump this (pass the git
      sha) on every submission so the run is never deduplicated to a stale output.

code: .
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:5

command: >-
  python pipeline_executor.py
  --config config_jev_train.json
  --mount-dir ${{inputs.msndni}}
  --model-path ${{inputs.model_path}}
  --data-root ${{inputs.data_root}}
  --batch-size ${{inputs.batch_size}}
  --micro-batch-size ${{inputs.micro_batch_size}}
  --num-epochs ${{inputs.num_epochs}}
  --neg-ratio ${{inputs.neg_ratio}}
  --hard-neg-ratio ${{inputs.hard_neg_ratio}}
  --max-history ${{inputs.max_history}}
  --cutoff-len ${{inputs.cutoff_len}}
  --sample ${{inputs.sample}}
  --use-chat-template ${{inputs.use_chat_template}}
  --use-abstract ${{inputs.use_abstract}}
  --kl-beta ${{inputs.kl_beta}}
  --enable-kl ${{inputs.enable_kl}}
  --loss-type ${{inputs.loss_type}}
  --prompt-contract ${{inputs.prompt_contract}}
  --source-revision ${{inputs.source_revision}}
  --output-root ${{inputs.output_root}}
  --code-revision ${{inputs.code_revision}}
