$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: mind_dual_train
display_name: MIND Contrastive Dual-Encoder Train + Eval
version: "1"
type: command
description: From-scratch NRMS-style contrastive dual-encoder training (InfoNCE+BCE) on MIND, then evaluate on dev emitting per-impression normalized score files for the weighted-sum ensemble.

inputs:
  msndni:
    type: uri_folder
    mode: rw_mount
    description: 数据存储挂载路径
  data_root:
    type: string
    default: "shares/users/wuc/data/MIND_small"
    description: 数据集根目录（相对于挂载路径）
  output_root:
    type: string
    default: "shares/users/wuc/output_dir"
    description: 输出目录根路径（相对于挂载路径）
  mind_size:
    type: string
    default: "small"
    description: MIND 数据集大小 (small/large)
  d_model:
    type: integer
    default: 128
    description: 嵌入/隐藏维度
  num_hist:
    type: integer
    default: 20
    description: 用户历史新闻数量
  max_news_len:
    type: integer
    default: 64
    description: 新闻 token 最大长度
  batch_size:
    type: integer
    default: 256
    description: 训练批次大小
  num_epochs:
    type: integer
    default: 8
    description: 训练轮数
  max_history:
    type: integer
    default: 50
    description: 最大历史记录长度
  lr:
    type: number
    default: 0.001
    description: 学习率
  use_abstract:
    type: integer
    default: 0
    description: 是否使用新闻摘要 (1=是, 0=否)
  per_pos_neg:
    type: integer
    default: 2
    description: 每个正样本的负样本采样数
  history_as_neg:
    type: integer
    default: 0
    description: 是否用历史新闻做难负样本 (1=是, 0=否)
  infonce_weight:
    type: number
    default: 1.0
    description: InfoNCE loss 权重
  bce_weight:
    type: number
    default: 1.0
    description: BCE loss 权重
  temperature:
    type: number
    default: 0.07
    description: InfoNCE 温度

code: .
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:5

command: >-
  python pipeline_executor.py
  --config config_mind_dual_train.json
  --mount-dir ${{inputs.msndni}}
  --data-root ${{inputs.data_root}}
  --output-root ${{inputs.output_root}}
  --batch-size ${{inputs.batch_size}}
  --num-epochs ${{inputs.num_epochs}}
  --max-history ${{inputs.max_history}}
  --use-abstract ${{inputs.use_abstract}}
