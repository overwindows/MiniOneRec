$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: jev_frozen_readout_double_train
display_name: Frozen JEV Training-Only Doubled Data
version: "1"
type: command
description: Fixed binary L2 0.01,262144-pair cap,reuse verified131071-pair cache; no dev
inputs:
  msndni:
    type: uri_folder
    mode: rw_mount
  model_path:
    type: string
  data_root:
    type: string
  output_root:
    type: string
  source_revision:
    type: string
  readout_head:
    type: string
  readout_head_sha256:
    type: string
  readout_holdout_cache:
    type: string
code: .
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:5
command: >-
  python pipeline_executor.py
  --config config_jev_readout_double_scale.json
  --mount-dir ${{inputs.msndni}}
  --model-path ${{inputs.model_path}}
  --data-root ${{inputs.data_root}}
  --output-root ${{inputs.output_root}}
  --source-revision ${{inputs.source_revision}}
  --readout-head ${{inputs.readout_head}}
  --readout-head-sha256 ${{inputs.readout_head_sha256}}
  --readout-holdout-cache ${{inputs.readout_holdout_cache}}
  --debug-mode false
