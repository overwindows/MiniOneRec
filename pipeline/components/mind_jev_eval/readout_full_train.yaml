$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: jev_full_official_training_readout
display_name: Full Official MIND-small Training Readout
version: "1"
type: command
description: All469264 sampled rows/all156965 official impressions,no training holdout;bounded feature shard
inputs:
  msndni:
    type: uri_folder
    mode: rw_mount
  model_path:
    type: string
  data_root:
    type: string
  output_root:
    type: string
  source_revision:
    type: string
  readout_cache_root:
    type: string
  readout_holdout_cache:
    type: string
  full_training_stage:
    type: integer
command: >-
  python pipeline_executor.py
  --config config_jev_readout_full_train.json
  --mount-dir ${{inputs.msndni}}
  --model-path ${{inputs.model_path}}
  --data-root ${{inputs.data_root}}
  --output-root ${{inputs.output_root}}
  --source-revision ${{inputs.source_revision}}
  --readout-cache-root ${{inputs.readout_cache_root}}
  --readout-holdout-cache ${{inputs.readout_holdout_cache}}
  --full-training-stage ${{inputs.full_training_stage}}
  --debug-mode false
code: .
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:5
