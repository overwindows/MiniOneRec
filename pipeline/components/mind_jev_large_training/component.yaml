$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: jev_large_semantic_training
display_name: Full-impression MIND-large semantic training
version: "1"
type: command
description: Frozen article features and complete training-only fixed recipes; no dev/test inputs
inputs:
  msndni:
    type: uri_folder
    mode: rw_mount
  contract:
    type: uri_folder
    mode: download
  parity_cache:
    type: uri_folder
    mode: download
  source_revision:
    type: string
  output_root:
    type: string
  parity_sha256:
    type: string
command: >-
  python -u entry.py
  --mount ${{inputs.msndni}}
  --contract ${{inputs.contract}}
  --parity-cache ${{inputs.parity_cache}}
  --source-revision ${{inputs.source_revision}}
  --output-root ${{inputs.output_root}}
  --parity-sha256 ${{inputs.parity_sha256}}
code: .
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:5
