$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: mind_pointwise_rl
display_name: MIND Pointwise RL Training
version: "1"
type: command
description: MIND Pointwise Yes/No RL post-training using VERL

inputs:
  msndni:
    type: uri_folder
    mode: rw_mount
    description: 数据存储挂载路径
  sft_model:
    type: string
    description: SFT checkpoint 路径（相对于挂载路径）
  data_root:
    type: string
    default: "shares/users/wuc/data/MIND_large"
    description: 数据集根目录（相对于挂载路径）
  output_root:
    type: string
    default: "shares/users/wuc/output_dir"
    description: 输出目录根路径（相对于挂载路径）
  reward_type:
    type: string
    default: "pointwise_asymmetric"
    description: 奖励类型 (pointwise_asymmetric/pointwise_binary/pointwise_weighted/pointwise_margin)
  max_response_length:
    type: integer
    default: 8
    description: 最大响应长度 (Yes/No 只需 1-2 tokens，设 8 留余量)
  max_prompt_length:
    type: integer
    default: 4096
    description: 最大提示长度
  train_batch_size:
    type: integer
    default: 128
    description: 训练批次大小
  learning_rate:
    type: string
    default: "1e-7"
    description: 学习率
  kl_loss_coef:
    type: number
    default: 0.1
    description: KL 损失系数
  total_epochs:
    type: integer
    default: 1
    description: 训练轮数
  num_generations:
    type: integer
    default: 8
    description: 每个样本的生成数量 (GRPO group size)
  max_history:
    type: integer
    default: 30
    description: 最大历史记录长度
  neg_ratio:
    type: number
    default: 2.0
    description: 负样本比例 (必须与 SFT 训练一致)
  use_abstract:
    type: integer
    default: 1
    description: 是否使用新闻摘要 1=是 0=否 (必须与 SFT 训练一致)
  use_chat_template:
    type: integer
    default: 1
    description: 是否使用 chat template 1=是 0=否 (必须与 SFT 训练一致)
  regenerate_data:
    type: integer
    default: 0
    description: 是否强制重新生成 parquet 数据 1=是 0=否
  debug_mode:
    type: string
    default: "false"
    description: 调试模式 (true/false)
  run_eval:
    type: integer
    default: 1
    description: 训练后是否运行评估 (1=是, 0=否)
  eval_split:
    type: string
    default: "dev"
    description: 评估数据集 (dev/test)

code: .
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:5

command: >-
  python pipeline_executor.py
  --config config_mind_pointwise_rl.json
  --mount-dir ${{inputs.msndni}}
  --sft-model ${{inputs.sft_model}}
  --data-root ${{inputs.data_root}}
  --output-root ${{inputs.output_root}}
  --reward-type ${{inputs.reward_type}}
  --max-response-length ${{inputs.max_response_length}}
  --max-prompt-length ${{inputs.max_prompt_length}}
  --train-batch-size ${{inputs.train_batch_size}}
  --learning-rate ${{inputs.learning_rate}}
  --kl-loss-coef ${{inputs.kl_loss_coef}}
  --total-epochs ${{inputs.total_epochs}}
  --num-generations ${{inputs.num_generations}}
  --max-history ${{inputs.max_history}}
  --neg-ratio ${{inputs.neg_ratio}}
  --use-abstract ${{inputs.use_abstract}}
  --use-chat-template ${{inputs.use_chat_template}}
  --regenerate-data ${{inputs.regenerate_data}}
  --debug-mode ${{inputs.debug_mode}}
  --run-eval ${{inputs.run_eval}}
  --eval-split ${{inputs.eval_split}}
