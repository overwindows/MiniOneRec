$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: mind_train
display_name: MIND SFT Training
version: "1"
type: command
description: MIND SFT pointwise training using DeepSpeed

inputs:
  msndni:
    type: uri_folder
    mode: rw_mount
    description: 数据存储挂载路径
  model_path:
    type: string
    default: "Qwen/Qwen3-1.7B"
    description: 预训练模型路径或HuggingFace模型ID
  data_root:
    type: string
    default: "shares/users/wuc/data/MIND_small"
    description: 数据集根目录（相对于挂载路径）
  batch_size:
    type: integer
    default: 256
    description: 全局批次大小
  micro_batch_size:
    type: integer
    default: 4
    description: 每个GPU的micro batch大小
  num_epochs:
    type: integer
    default: 3
    description: 训练轮数
  neg_ratio:
    type: number
    default: 2.0
    description: 负样本比例
  max_history:
    type: integer
    default: 30
    description: 最大历史记录长度
  cutoff_len:
    type: integer
    default: 8192
    description: 最大序列长度
  use_chat_template:
    type: integer
    default: 1
    description: 是否使用chat template (1=是, 0=否)
  use_abstract:
    type: integer
    default: 0
    description: 是否使用新闻摘要 (1=是, 0=否)
  use_subcategory:
    type: integer
    default: 0
    description: 是否在提示中使用子类别 (1=是, 0=否)
  pointwise_ratio:
    type: number
    default: 1.0
    description: 多任务训练中pointwise任务占比 (1.0=纯pointwise, <1.0=多任务)
  debug_mode:
    type: string
    default: "false"
    description: 调试模式 (true/false) - 出错继续 + sleep infinity
  output_root:
    type: string
    default: "shares/users/wuc/output_dir"
    description: 输出目录根路径（相对于挂载路径）
  run_eval:
    type: integer
    default: 1
    description: 训练后是否运行评估 (1=是, 0=否)
  eval_split:
    type: string
    default: "dev"
    description: 评估数据集 (dev/test)
  resume_from_checkpoint:
    type: string
    default: ""
    description: 从指定checkpoint继续训练，留空则从头开始

code: .
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:5

command: >-
  python pipeline_executor.py
  --config config_mind_train.json
  --mount-dir ${{inputs.msndni}}
  --model-path ${{inputs.model_path}}
  --data-root ${{inputs.data_root}}
  --batch-size ${{inputs.batch_size}}
  --micro-batch-size ${{inputs.micro_batch_size}}
  --num-epochs ${{inputs.num_epochs}}
  --neg-ratio ${{inputs.neg_ratio}}
  --max-history ${{inputs.max_history}}
  --cutoff-len ${{inputs.cutoff_len}}
  --use-chat-template ${{inputs.use_chat_template}}
  --use-abstract ${{inputs.use_abstract}}
  --use-subcategory ${{inputs.use_subcategory}}
  --pointwise-ratio ${{inputs.pointwise_ratio}}
  --debug-mode ${{inputs.debug_mode}}
  --output-root ${{inputs.output_root}}
  --run-eval ${{inputs.run_eval}}
  --eval-split ${{inputs.eval_split}}
  --resume-from-checkpoint ${{inputs.resume_from_checkpoint}}
